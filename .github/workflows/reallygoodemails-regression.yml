name: reallygoodemails-regression

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: Really Good Emails category slug when collection is empty.
        required: false
        default: promotional
      collection:
        description: Really Good Emails collection, for example latest.
        required: false
        default: latest
      limit:
        description: Number of templates to vendor and compare.
        required: false
        default: "12"

jobs:
  reallygoodemails:
    runs-on: ubuntu-latest
    env:
      RGE_CATEGORY: ${{ github.event.inputs.category || 'promotional' }}
      RGE_COLLECTION: ${{ github.event.inputs.collection || 'latest' }}
      RGE_LIMIT: ${{ github.event.inputs.limit || '12' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Really Good Emails pipeline
        env:
          RGE_EMAIL: ${{ secrets.RGE_EMAIL }}
          RGE_PASSWORD: ${{ secrets.RGE_PASSWORD }}
        run: |
          login_args=()
          if [ -n "${RGE_EMAIL:-}" ] && [ -n "${RGE_PASSWORD:-}" ]; then
            login_args=(--login)
          fi
          npm run research:pipeline -- \
            --provider reallygoodemails \
            --category "$RGE_CATEGORY" \
            --collection "$RGE_COLLECTION" \
            --limit "$RGE_LIMIT" \
            --include-existing \
            --work-dir /tmp/mail-canvas-rge-pipeline \
            "${login_args[@]}"
      - name: Append summary
        if: always()
        run: |
          echo "## Really Good Emails regression" >> "$GITHUB_STEP_SUMMARY"
          echo "- collection: $RGE_COLLECTION" >> "$GITHUB_STEP_SUMMARY"
          echo "- category: $RGE_CATEGORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- limit: $RGE_LIMIT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/mail-canvas-rge-pipeline/triage.md ]; then
            cat /tmp/mail-canvas-rge-pipeline/triage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pipeline report produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Really Good Emails artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reallygoodemails-regression
          path: |
            corpus/reallygoodemails
            corpus/catalog.json
            corpus/registry.json
            /tmp/mail-canvas-rge-pipeline/pipeline.json
            /tmp/mail-canvas-rge-pipeline/manifest.json
            /tmp/mail-canvas-rge-pipeline/audit.json
            /tmp/mail-canvas-rge-pipeline/triage.json
            /tmp/mail-canvas-rge-pipeline/triage.md
            /tmp/mail-canvas-rge-pipeline/first-bad-crops
            /tmp/mail-canvas-rge-pipeline/compare/comparison.json
            /tmp/mail-canvas-rge-pipeline/compare/comparison.report.json
            /tmp/mail-canvas-rge-pipeline/compare/report.md
            /tmp/mail-canvas-rge-pipeline/compare/browser
            /tmp/mail-canvas-rge-pipeline/compare/rust
            /tmp/mail-canvas-rge-pipeline/compare/diff
            /tmp/mail-canvas-rge-pipeline/compare/side-by-side
            /tmp/mail-canvas-rge-pipeline/compare/logs
          if-no-files-found: warn
