name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Cargo fmt
        run: cargo fmt --all --check
      - name: Cargo test
        run: cargo test --workspace
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Wasm target check
        run: cargo check -p mail-canvas-wasm --target wasm32-unknown-unknown

  playwright-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate corpus manifest
        run: npm run corpus:manifest
      - name: Run MailCanvas tools smoke test
        run: npm run test:tools
      - name: Build browser WASM bundle
        run: npm run build:browser
      - name: Run WASM thumbnail smoke test
        run: npm run test:wasm-thumbnail
      - name: Run Playwright regression
        run: npm run test:visual
      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression
          path: |
            /tmp/mail-canvas-playwright-regression/comparison.json
            /tmp/mail-canvas-playwright-regression/comparison.report.json
            /tmp/mail-canvas-playwright-regression/report.md
            /tmp/mail-canvas-playwright-regression/browser
            /tmp/mail-canvas-playwright-regression/rust
            /tmp/mail-canvas-playwright-regression/diff
            /tmp/mail-canvas-playwright-regression/side-by-side
            /tmp/mail-canvas-playwright-regression/logs
          if-no-files-found: warn

  playwright-golden-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate corpus manifest
        run: npm run corpus:manifest
      - name: Run observational golden corpus
        id: golden-corpus
        continue-on-error: true
        run: npm run compare:corpus
      - name: Append corpus summary
        if: always()
        run: |
          echo "## Golden corpus report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/mail-canvas-playwright-corpus/report.md ]; then
            cat /tmp/mail-canvas-playwright-corpus/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No corpus report produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.golden-corpus.outcome }}" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Corpus run completed with expectation failures. See uploaded artifact for latest diffs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full corpus artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-golden-corpus
          path: |
            /tmp/mail-canvas-playwright-corpus/comparison.json
            /tmp/mail-canvas-playwright-corpus/comparison.report.json
            /tmp/mail-canvas-playwright-corpus/report.md
            /tmp/mail-canvas-playwright-corpus/browser
            /tmp/mail-canvas-playwright-corpus/rust
            /tmp/mail-canvas-playwright-corpus/diff
            /tmp/mail-canvas-playwright-corpus/side-by-side
            /tmp/mail-canvas-playwright-corpus/logs
          if-no-files-found: warn
