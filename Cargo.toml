[workspace]
members = [
  "crates/mail-canvas-core",
  "crates/mail-canvas-native",
  "crates/mail-canvas-wasm",
  "crates/mail-canvas-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/Haofei/mail-canvas"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cosmic-text = "0.17.0"
crc32fast = "1"
css-inline = { version = "0.20.2", default-features = false }
data-url = "0.3.2"
fontdb = "0.23.0"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
js-sys = "=0.3.81"
kuchiki = "0.8.1"
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
pdf-writer = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = { version = "0.10.1", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
tiny-skia = "0.11.4"
ttf-parser = "0.25"
unicode-script = "0.5"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2"
wasm-bindgen = "=0.2.104"
wuff = "0.2.5"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
implicit_clone = "warn"
