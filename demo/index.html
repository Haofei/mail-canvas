<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MailCanvas WASM Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.22), transparent 28%),
          #0f172a;
      }

      .app {
        max-width: 1500px;
        margin: 0 auto;
        padding: 24px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
        margin-bottom: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 140px;
      }

      .field.grow {
        flex: 1 1 280px;
      }

      label {
        font-size: 12px;
        color: #94a3b8;
      }

      input, textarea, button, pre {
        font: inherit;
      }

      input, textarea {
        width: 100%;
        border: 1px solid #334155;
        background: #111827;
        color: #e2e8f0;
        padding: 10px 12px;
      }

      textarea {
        min-height: 560px;
        resize: vertical;
        line-height: 1.5;
      }

      button {
        border: 0;
        background: #2563eb;
        color: #ffffff;
        padding: 11px 16px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.7;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(380px, 1fr) minmax(420px, 1fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.2);
        padding: 16px;
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 14px;
        color: #f8fafc;
      }

      .preview-shell {
        background: #e5e7eb;
        min-height: 640px;
        overflow: auto;
        padding: 16px;
      }

      .preview-shell img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        background: #ffffff;
      }

      .status {
        min-height: 20px;
        margin-bottom: 12px;
        color: #93c5fd;
        font-size: 13px;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: #cbd5e1;
        font-size: 12px;
        line-height: 1.6;
      }

      @media (max-width: 1080px) {
        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <div class="field">
          <label for="width">Width</label>
          <input id="width" type="number" value="700" min="320" step="10">
        </div>
        <div class="field">
          <label for="viewport-height">Viewport Height</label>
          <input id="viewport-height" type="number" value="1400" min="200" step="10">
        </div>
        <div class="field">
          <label for="scale">Scale</label>
          <input id="scale" type="number" value="1" min="1" step="0.5">
        </div>
        <div class="field grow">
          <label for="base-url">Base URL</label>
          <input id="base-url" type="text">
        </div>
        <div class="field">
          <button id="render-button" type="button">Render Image</button>
        </div>
      </div>

      <div class="workspace">
        <section class="panel">
          <h2>Template HTML</h2>
          <textarea id="html-input" spellcheck="false"></textarea>
        </section>

        <section class="panel">
          <h2>Output</h2>
          <div id="status" class="status"></div>
          <div class="preview-shell">
            <img id="preview" alt="Rendered email preview">
          </div>
        </section>

        <section class="panel">
          <h2>Diagnostics</h2>
          <pre id="diagnostics"></pre>
        </section>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
  </html>
